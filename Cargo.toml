[workspace]
members = [
    "crates/tigrs-core",
    "crates/tigrs-git",
    "crates/tigrs-ui",
    "crates/tigrs-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["David Lin <dtwlin@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtwlin/tigrs"
homepage = "https://github.com/dtwlin/tigrs"
documentation = "https://github.com/dtwlin/tigrs#readme"
readme = "README.md"
keywords = ["git", "tui", "tig", "terminal", "vcs"]
categories = ["command-line-utilities", "development-tools::version-control"]

[workspace.dependencies]
tigrs-core = { path = "crates/tigrs-core", version = "0.1.0" }
tigrs-git = { path = "crates/tigrs-git", version = "0.1.0" }
tigrs-ui = { path = "crates/tigrs-ui", version = "0.1.0" }
arrayvec = "0.7"
bitflags = "2.8"
clap = { version = "4.5.31", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
clru = "0.6"
crossbeam-channel = "0.5.14"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
gix = "0.83.0"
gix-commitgraph = "0.37.1"
hashbrown = "0.16.1"
indexmap = "2.14"
itoa = "1.0.18"
memchr = "2.8"
notify = "6.1.1"
parking_lot = "0.12"
rayon = "1.10"
regex = "1.11"
rustix = "1.1.4"
scopeguard = "1.2.0"
serde = { version = "1.0.219", features = ["derive"] }
shlex = "2.0"
signal-hook = "0.4.4"
smallvec = "1.13"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tempfile = "3.17"
thiserror = "2.0.12"
toml = "0.8.20"
toml_edit = "0.22"
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
debug = true
