name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_CONFIG_SYSTEM: /dev/null
  GIT_CONFIG_NOSYSTEM: "1"

jobs:
  check:
    name: Check, Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  msrv:
    name: Minimum Supported Rust Version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Check MSRV Build
        run: cargo check --workspace --all-targets --locked

  test:
    name: Test Suite
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install Git (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git
      - name: Run Tests
        run: cargo test --workspace --all-targets
      - name: Run Doc Tests
        run: cargo test --workspace --doc

  loom:
    name: Concurrency Model Check (Loom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Run Loom Permutation Tests
        run: cargo test -p tigrs-core --features loom --test loom_cancel

  build-release:
    name: Build Release Binary
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Build Release
        run: cargo build --release
      - name: Verify CLI Help
        run: ./target/release/tigrs --help
